# Valores por defecto. Los cambios del usuario se guardan en
# %LOCALAPPDATA%\KasaneTetoAI\settings.json y tienen prioridad.

[pet]
pack = "provisional"
scale = 100           # porcentaje, de 25 a 300
always_on_top = true

[voice]
tts_enabled = true
model = "es_MX-claude-high"
length_scale = 0.9    # menos es más rápido
volume = 80           # de 0 a 100
mic_enabled = false   # el micrófono empieza apagado
idle_minutes = 5      # se cierran los procesos de voz tras este tiempo sin uso
stt_threads = 4
stt_model = "small"   # carpeta dentro de models/whisper

[ai]
device = "auto"       # auto, gpu o cpu
gpu_model = "Qwen3.5-4B-Q4_K_M.gguf"
cpu_model = "Qwen3.5-2B-Q4_K_M.gguf"
gpu_layers = 99
gpu_min_free_mib = 3100
context_size = 4096
threads = 6
max_tokens = 400
temperature = 0.3     # con 0,7 inventa bastante más
repeat_penalty = 1.05 # evita bucles en listas; más alto distorsiona los datos del prompt
idle_minutes = 5      # se cierra llama-server tras este tiempo sin uso
load_timeout_seconds = 120

[web]
enabled = false       # nada sale a Internet hasta activarlo en Configuración
