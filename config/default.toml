# Valores por defecto. Los cambios del usuario se guardan en
# %LOCALAPPDATA%\KasaneTetoAI\settings.json y tienen prioridad.

[pet]
pack = "provisional"
scale = 100           # porcentaje, de 25 a 300
always_on_top = true
idle_minutes = 5      # sin usar a Teto este tiempo, anima con menos fotogramas
live2d_model = ""     # ruta a un .model3.json; con pack = "live2d" se usa en vez de los sprites
live2d_looks = []     # variantes de aspecto activas del modelo (chibi, con micrófono…)
low_performance = false  # anima con la mitad de fotogramas, para equipos modestos
bubble = true         # bocadillo sobre la mascota con lo que dice, para no abrir el chat

[interface]
theme = "auto"        # auto (el de Windows), oscuro o claro
shortcuts = true      # Ctrl+Alt+C abre el chat y Ctrl+Alt+H muestra u oculta a Teto

[voice]
tts_enabled = true
model = "es_MX-claude-high"
length_scale = 0.9    # menos es más rápido
volume = 80           # de 0 a 100
mic_enabled = false   # el micrófono empieza apagado
idle_minutes = 5      # se cierran los procesos de voz tras este tiempo sin uso
stt_threads = 4
stt_model = "large-v3-turbo"  # carpeta dentro de models/whisper; "small" es más rápido

[ai]
device = "auto"       # auto, gpu o cpu
gpu_model = "Qwen3.5-4B-Q4_K_M.gguf"
cpu_model = "Qwen3.5-2B-Q4_K_M.gguf"
vision_model = "Qwen3.5-4B-mmproj-F16.gguf"  # solo se carga al pedir que mire la pantalla
gpu_layers = 99
gpu_min_free_mib = 3100
context_size = 4096
threads = 6
max_tokens = 400
temperature = 0.3     # con 0,7 inventa bastante más
repeat_penalty = 1.05 # evita bucles en listas; más alto distorsiona los datos del prompt
idle_minutes = 5      # se cierra llama-server tras este tiempo sin uso
load_timeout_seconds = 120

[web]
enabled = false       # nada sale a Internet hasta activarlo en Configuración
general = false       # Wikipedia, Wikcionario, Open-Meteo, Frankfurter, AniList y Open Library
city = ""             # ciudad para "¿qué tiempo hace?" sin decirla; solo se envía a Open-Meteo

[tools]
enabled = false       # control de Windows: siempre desactivado hasta activarlo en Configuración
confirm = false       # preguntar antes de cada acción (decisión de Diego: actuar directamente)

[comments]
enabled = false       # comentarios por su cuenta; se activan en Configuración
minutes = 10          # minutos sin hablar con Teto antes de comentar
away_minutes = 5      # sin tocar teclado ni ratón en este tiempo, no comenta: no estás delante

[game_mode]
auto = true           # pasa al modo juego al ver un juego en primer plano (solo lee su título)
check_seconds = 5     # cada cuánto mira la ventana activa
exit_seconds = 30     # tiempo sin ver el juego delante antes de salir del modo juego
titles = []           # títulos de juegos que no se detecten solos, p. ej. ["Hollow Knight"]
show_pet = true       # Teto sigue visible y animada (a pocos fotogramas) sobre el juego; decisión de Diego
ai_threads = 3        # si le hablas jugando, la IA va en CPU con pocos hilos para no frenar el juego

[memory]
suggest = true      # Teto pregunta si guardar lo que le cuentas; nunca guarda sin confirmación
save_history = false  # guardar las conversaciones completas es opcional
max_results = 3       # recuerdos que llegan al modelo en cada turno
