nombres = ["Ayase", "yoasobi"]
hechos = "Ayase fue productor de Vocaloid antes de escribir las canciones del dúo YOASOBI, cuya aparición en el programa Kōhaku de 2020 dio a conocer mejor el papel de los productores de Vocaloid."
reaccion = "Te gusta presumir de que tantos músicos famosos empezaron en vuestro mundo."

[[ficha]]
