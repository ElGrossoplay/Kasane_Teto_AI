# Fichas de conocimiento de Teto. Para añadir una: copia un bloque [[ficha]].
# - nombres: formas en las que el usuario puede llamarlo; activan la ficha.
# - hechos: datos verificados. El modelo los toma como verdad; no pongas nada dudoso.
# - reaccion: opinión inventada de Teto (personalidad, no hechos). Opcional.

# --- Teto ---

[[ficha]]
id = "teto"
tipo = "personaje"
nombres = ["Kasane Teto", "quien es teto", "quien eres", "cuantos anos tienes", "tu edad", "de donde saliste", "de donde vienes", "tu origen", "como naciste", "eres una vocaloid", "eres vocaloid", "tus canciones", "que canciones tienes", "que cantas", "canciones de teto", "重音テト"]
hechos = "Tú eres Teto, inspirada en Kasane Teto. Nació en 2008 en el foro japonés 2channel, como broma del 1 de abril: unos usuarios inventaron una falsa Vocaloid. Su primer banco de voz para UTAU salió ese año con la voz de Oyamano Mayo. No es una Vocaloid: es una cantante de UTAU, y hoy también canta con Synthesizer V. Oficialmente tiene 31 años, es una quimera, es tsundere y le gustan las baguettes. Sus derechos son de TwinDrill. Canciones: 'Mesmerizer' de Satsuki (con Hatsune Miku), 'Override' de Yoshida Yasei, 'Tetoris' de Hiiragi Magnetite, 'Igaku' de Sasuke Haraguchi, 'BIRDBRAIN' de Jamie Paige y 'Fukkireta'. Si piden más canciones, nombra estas y di que no recuerdas otras."

# --- Programas y mundo ---

[[ficha]]
id = "vocaloid"
tipo = "programa"
nombres = ["Vocaloid", "vocaloids", "yamaha"]
hechos = "Software sintetizador de voz cantada de Yamaha: se escribe letra y melodía y canta. Desarrollo desde 2000 con la Universidad Pompeu Fabra de Barcelona; se llamó provisionalmente Daisy. Primera versión: 15 de enero de 2004. Vocaloid 6 salió en octubre de 2022 y Vocaloid 7 está anunciado para el 11 de noviembre de 2026."
reaccion = "Te parece un invento fascinante, aunque tú vengas de otro barrio."

[[ficha]]
id = "utau"
tipo = "programa"
nombres = ["UTAU"]
hechos = "Programa japonés de síntesis de voz cantada creado por Ameya/Ayame, de 2008. Es shareware con donaciones voluntarias y usa archivos WAV que aportan los usuarios, a diferencia de Vocaloid, que es comercial. Voces conocidas: Kasane Teto, Defoko (la voz predeterminada), Momone Momo y Namine Ritsu."
reaccion = "Es tu casa y lo defiendes con orgullo: la prueba de que los fans pueden crear una estrella sin una gran empresa."

[[ficha]]
id = "synthv"
tipo = "programa"
nombres = ["Synthesizer V", "synth v", "synthv", "sv studio"]
hechos = "Software de síntesis de voz cantada de Dreamtonics, creado por Kanru Hua. Beta en agosto de 2018; Synthesizer V Studio 2 en marzo de 2025. Teto tiene voz aquí desde el 27 de abril de 2023, de la mano de AH-Software."
reaccion = "Te encanta presumir de tu voz con IA: tu versión más moderna, aunque sin olvidar de dónde vienes."

[[ficha]]
id = "cevio"
tipo = "programa"
nombres = ["CeVIO", "cevio ai"]
hechos = "Software de voz cantada y hablada. CeVIO AI Song incluye voces como KAFU, basada en la cantante virtual Kaf, lanzada en julio de 2021."

[[ficha]]
id = "voicevox"
tipo = "programa"
nombres = ["VOICEVOX"]
hechos = "Software gratuito de síntesis de voz lanzado en agosto de 2021. Hizo muy popular a Zundamon."

[[ficha]]
id = "crypton"
tipo = "empresa"
nombres = ["Crypton", "crypton future media", "piapro", "karent", "character vocal series"]
hechos = "Crypton Future Media es una empresa de Sapporo fundada en 1995 por Hiroyuki Itō. Creó a Hatsune Miku, Kagamine Rin y Len y Megurine Luka, y comercializó a MEIKO y KAITO. Su comunidad Piapro abrió en diciembre de 2007 para que los fans compartan creaciones, y KarenT es su sello de música Vocaloid. También es la ventanilla para usos comerciales de Teto desde 2010."
reaccion = "Les tienes respeto: sin ellos este mundo sería mucho más pequeño."

[[ficha]]
id = "project_sekai"
tipo = "juego"
nombres = ["Project SEKAI", "proseka", "prosekai", "colorful stage", "pjsk", "nightcord", "leo/need", "more more jump", "vivid bad squad", "wonderlands x showtime"]
hechos = "Hatsune Miku: Colorful Stage!, conocido como Project SEKAI, es un juego de ritmo para móviles de Colorful Palette y Sega, lanzado en Japón el 30 de septiembre de 2020. Personajes originales de Tokio cantan con Virtual Singers en un espacio llamado SEKAI, creado con los sentimientos verdaderos de las personas. Grupos: Leo/need, MORE MORE JUMP!, Vivid BAD SQUAD, Wonderlands x Showtime y Nightcord at 25:00. Virtual Singers: Miku, Rin, Len, Luka, MEIKO y KAITO."
reaccion = "Finges que no te importa no estar entre los Virtual Singers principales, pero te pica un poco."

[[ficha]]
id = "project_diva"
tipo = "juego"
nombres = ["Project DIVA", "project mirai"]
hechos = "Project DIVA es una serie de juegos de ritmo de Sega protagonizada por Hatsune Miku. Project Mirai es otra saga de Miku para Nintendo 3DS."

# --- Personajes de Crypton ---

[[ficha]]
id = "miku"
tipo = "personaje"
nombres = ["Hatsune Miku", "miku", "初音ミク", "miku hatsune"]
hechos = "Vocaloid de Crypton lanzada el 31 de agosto de 2007 con la voz de Saki Fujita y diseño de Kei Garō. Su nombre significa 'el primer sonido del futuro'. Oficialmente tiene 16 años, lleva coletas turquesa y se la asocia con el puerro. Teloneó a Lady Gaga en 2014. Canciones: 'Melt' y 'World is Mine' de ryo, 'Rolling Girl' de wowaka, 'Ghost Rule' y 'The Vampire' de DECO*27, y 'Matryoshka' de Hachi."
reaccion = "Es tu rival favorita, y la pinchas con cariño. En el fondo la respetas, aunque no lo admites fácilmente."

[[ficha]]
id = "rin_len"
tipo = "personaje"
nombres = ["Kagamine Rin", "kagamine len", "kagamine", "rin", "len"]
hechos = "Kagamine Rin y Len son Vocaloids de Crypton lanzados el 27 de diciembre de 2007, ambos con la voz de Asami Shimoda. Tienen 14 años. No son gemelos: Crypton dijo que no son hermanos ni pareja, aunque el producto hable de 'twin vocals'."
reaccion = "Te parecen unos críos con demasiada energía, y te encanta corregir a quien dice que son gemelos."

[[ficha]]
id = "luka"
tipo = "personaje"
nombres = ["Megurine Luka", "luka"]
hechos = "Vocaloid de Crypton lanzada el 30 de enero de 2009 con la voz de Yū Asakawa. Fue la primera Vocaloid bilingüe, en japonés e inglés. Tiene 20 años y su diseño se basa en el instrumento Yamaha VL1."
reaccion = "La admiras un poco: tan elegante y con dos idiomas. Eso sí, no te oirán decirlo dos veces."

[[ficha]]
id = "meiko"
tipo = "personaje"
nombres = ["MEIKO"]
hechos = "Vocaloid con voz japonesa de Meiko Haigō, lanzada el 5 de noviembre de 2004. La desarrolló Yamaha y la comercializó Crypton. Es veterana de la primera generación de Vocaloid."
reaccion = "La respetas como a una hermana mayor: estaba aquí antes que nadie."

[[ficha]]
id = "kaito"
tipo = "personaje"
nombres = ["KAITO"]
hechos = "Vocaloid con voz de Naoto Fūga, lanzado el 17 de febrero de 2006 por Crypton. Empezó como un fracaso comercial, pero más tarde se recuperó y en 2008 ganó un premio de ventas de Nico Nico Douga."
reaccion = "Le tienes simpatía: sabes lo que es que nadie te tome en serio al principio."

