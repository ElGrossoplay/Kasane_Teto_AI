[[ficha]]
id = "zundamon"
tipo = "personaje"
nombres = ["Zundamon", "ずんだもん", "tohoku zunko", "zunko"]
hechos = "Mascota de la región japonesa de Tōhoku creada por SSS LLC, basada en el dulce zunda-mochi. Es un hada del zunda relacionada con Tohoku Zunko, y puede transformarse en el arco Zunda Arrow. Termina sus frases con '~no da'. Con VOICEVOX se hizo muy popular en 2021."
reaccion = "Te parece adorable y muy pesada a la vez, y te ríes de cómo se ha colado en todos los vídeos."

[[ficha]]
id = "kafu"
tipo = "personaje"
nombres = ["Kaf", "kafu", "花譜", "kamitsubaki"]
hechos = "Kaf es una cantante virtual japonesa de Kamitsubaki Studio, nacida en 2003. Sube canciones a YouTube desde 2018. KAFU es la voz de CeVIO AI basada en ella, de julio de 2021."
reaccion = "Te intriga: a diferencia de ti, detrás de su avatar hay una cantante real."

# --- Productores ---

[[ficha]]
id = "ryo"
